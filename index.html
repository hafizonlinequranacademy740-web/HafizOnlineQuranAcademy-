<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hafiz Online Quran Academy - Learn Quran Online with Certified Male & Female Teachers worldwide via Zoom & Google Meet.">
    <title>Hafiz Online Quran Academy | Learn Quran Online Worldwide</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS RESET & VARIABLES */
        :root {
            --primary-green: #0B5D3F;
            --primary-dark: #063A27;
            --primary-light: #127d56;
            --gold: #FFD700;
            --gold-dark: #D4AF37;
            --white: #FFFFFF;
            --light-bg: #F4F8F6;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 215, 0, 0.2);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(11, 93, 63, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-dark);
            background-color: var(--light-bg);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Cinzel', serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        /* REUSABLE UTILITIES */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-padding {
            padding: 90px 0;
        }

        .section-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 50px auto;
        }

        .section-header .tag {
            color: var(--gold-dark);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: inline-block;
        }

        .section-header h2 {
            font-size: 2.5rem;
            color: var(--primary-dark);
            margin-bottom: 15px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: var(--primary-dark);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .btn-gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
        }

        .btn-green {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-dark) 100%);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(11, 93, 63, 0.3);
        }

        .btn-green:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(11, 93, 63, 0.5);
        }

        .btn-outline-gold {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
        }

        .btn-outline-gold:hover {
            background: var(--gold);
            color: var(--primary-dark);
        }

        /* TOP BAR */
        .top-bar {
            background: var(--primary-dark);
            color: var(--white);
            padding: 10px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
        }

        .top-bar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-info {
            display: flex;
            gap: 20px;
        }

        .top-info span i {
            color: var(--gold);
            margin-right: 6px;
        }

        .social-links {
            display: flex;
            gap: 15px;
        }

        .social-links a {
            color: var(--white);
            transition: var(--transition);
        }

        .social-links a:hover {
            color: var(--gold);
        }

        /* STICKY NAVIGATION */
        .navbar {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-box img {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-link {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.95rem;
            transition: var(--transition);
            position: relative;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary-green);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold-dark);
            transition: var(--transition);
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--primary-dark);
        }

        /* HERO SECTION */
        .hero {
            position: relative;
            background: linear-gradient(135deg, rgba(6, 58, 39, 0.92) 0%, rgba(11, 93, 63, 0.85) 100%),
                        url('https://images.unsplash.com/photo-1584286595398-a59f21d313f5?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            color: var(--white);
            padding: 120px 0 140px 0;
            clip-path: polygon(0 0, 100% 0, 100% 95%, 0 100%);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 50px;
            align-items: center;
        }

        .hero-text h1 {
            font-size: 3.2rem;
            line-height: 1.2;
            margin-bottom: 20px;
            color: var(--white);
        }

        .hero-text h1 span {
            color: var(--gold);
        }

        .hero-text p {
            font-size: 1.15rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 35px;
            max-width: 600px;
        }

        .hero-cta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .hero-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(12px);
            color: var(--text-dark);
        }

        .hero-card img {
            max-height: 160px;
            margin-bottom: 15px;
        }

        .hero-card h3 {
            color: var(--primary-dark);
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .hero-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ABOUT SECTION */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-image {
            position: relative;
        }

        .about-image img {
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            border: 4px solid var(--white);
        }

        .about-badge {
            position: absolute;
            bottom: -20px;
            right: -20px;
            background: var(--primary-dark);
            color: var(--gold);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--gold);
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        .about-badge span {
            display: block;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }

        .about-features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .about-feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: var(--primary-dark);
        }

        .about-feature-item i {
            color: var(--gold-dark);
            background: rgba(212, 175, 55, 0.15);
            padding: 10px;
            border-radius: 50%;
        }

        /* COURSES SECTION */
        .courses {
            background: var(--white);
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .course-card {
            background: var(--light-bg);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(11, 93, 63, 0.08);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .course-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-green), var(--gold));
            opacity: 0;
            transition: var(--transition);
        }

        .course-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            background: var(--white);
        }

        .course-card:hover::before {
            opacity: 1;
        }

        .course-icon {
            width: 60px;
            height: 60px;
            background: rgba(11, 93, 63, 0.1);
            color: var(--primary-green);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 20px;
        }

        .course-card h3 {
            font-size: 1.25rem;
            color: var(--primary-dark);
            margin-bottom: 12px;
        }

        .course-card p {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-bottom: 20px;
        }

        .course-link {
            color: var(--primary-green);
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .course-card:hover .course-link {
            gap: 12px;
            color: var(--gold-dark);
        }

        /* WHY CHOOSE US */
        .why-us-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .feature-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .feature-card:hover {
            transform: translateY(-5px);
            background: var(--primary-dark);
            color: var(--white);
        }

        .feature-card:hover h3 {
            color: var(--gold);
        }

        .feature-card:hover p {
            color: rgba(255, 255, 255, 0.8);
        }

        .feature-card .icon-box {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .feature-card h3 {
            font-size: 1.15rem;
            color: var(--primary-dark);
            margin-bottom: 10px;
            transition: var(--transition);
        }

        .feature-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: var(--transition);
        }

        /* TEACHERS SECTION */
        .teachers {
            background: var(--white);
        }

        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .teacher-card {
            border-radius: 16px;
            overflow: hidden;
            background: var(--light-bg);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            text-align: center;
        }

        .teacher-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .teacher-img {
            height: 240px;
            background: var(--primary-dark);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 4rem;
        }

        .teacher-info {
            padding: 25px;
        }

        .teacher-info h3 {
            font-size: 1.2rem;
            color: var(--primary-dark);
            margin-bottom: 5px;
        }

        .teacher-info .role {
            color: var(--gold-dark);
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: block;
        }

        .teacher-info p {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        /* STATISTICS COUNTER */
        .stats {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-green) 100%);
            color: var(--white);
            padding: 60px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            text-align: center;
        }

        .stat-item .number {
            font-size: 3rem;
            font-weight: 800;
            color: var(--gold);
            font-family: 'Cinzel', serif;
        }

        .stat-item p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* TESTIMONIALS */
        .testimonials-slider {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .testimonial-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .testimonial-slide {
            min-width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .testimonial-box {
            background: var(--white);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            position: relative;
        }

        .testimonial-box i.quote-icon {
            font-size: 2.5rem;
            color: rgba(212, 175, 55, 0.3);
            margin-bottom: 15px;
        }

        .testimonial-box p {
            font-size: 1.05rem;
            color: var(--text-dark);
            font-style: italic;
            margin-bottom: 25px;
        }

        .client-info h4 {
            color: var(--primary-dark);
            font-size: 1.1rem;
        }

        .client-info span {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .slider-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .slider-dot {
            width: 12px;
            height: 12px;
            background: #CBD5E1;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
        }

        .slider-dot.active {
            background: var(--primary-green);
            width: 28px;
            border-radius: 10px;
        }

        /* FAQ ACCORDION */
        .faq {
            background: var(--white);
        }

        .faq-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .faq-item {
            background: var(--light-bg);
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .faq-header {
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            color: var(--primary-dark);
            font-size: 1.05rem;
        }

        .faq-header i {
            color: var(--gold-dark);
            transition: var(--transition);
        }

        .faq-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            background: var(--white);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .faq-item.active .faq-header i {
            transform: rotate(180deg);
        }

        .faq-item.active .faq-body {
            padding: 20px 25px;
            max-height: 200px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        /* ADMISSION FORM & CONTACT SECTION */
        .admission-contact-wrapper {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 50px;
        }

        .form-card {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(11, 93, 63, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
